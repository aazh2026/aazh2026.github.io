<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-serif, Georgia, serif" viewBox="0 0 720 560"><title>A-RAG：把检索决策权交给模型</title><desc>上半部分展示 A-RAG 的三层检索接口 keyword_search、semantic_search、chunk_read，粒度由模型自己决定。下半部分是 HotpotQA 上各方法的检索 token 数横向条形图：A-RAG Naive 27455、GraphRAG 8744、Naive RAG 5358、A-RAG Full 2737。</desc><path fill="#faf9f5" d="M0 0h720v560H0z"/><text x="360" y="30" fill="#141413" font-size="17" font-weight="500" text-anchor="middle">A-RAG：把检索决策权交给模型</text><text x="360" y="50" fill="#87867f" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">来源 · A-RAG (arXiv:2602.03442, 2026-02) · HotpotQA 检索 token</text><rect width="660" height="186" x="30" y="68" fill="#fff" stroke="#d1cfc5" stroke-width="1.5" rx="8"/><text x="48" y="92" fill="#141413" font-size="13" font-weight="500">分层检索接口（粒度由模型自己决定）</text><rect width="188" height="56" x="48" y="104" fill="#fff" stroke="#d97757" stroke-width="1.8" rx="6"/><text x="142" y="126" fill="#141413" font-size="12" text-anchor="middle">keyword_search</text><text x="142" y="144" fill="#87867f" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">命中实体 / 术语</text><path stroke="#d1cfc5" stroke-width="1.2" d="M254 132h22m-6-5 8 5-8 5"/><rect width="188" height="56" x="288" y="104" fill="#fff" stroke="#d97757" stroke-width="1.8" rx="6"/><text x="382" y="126" fill="#141413" font-size="12" text-anchor="middle">semantic_search</text><text x="382" y="144" fill="#87867f" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">相似段落</text><path stroke="#d1cfc5" stroke-width="1.2" d="M494 132h22m-6-5 8 5-8 5"/><rect width="188" height="56" x="528" y="104" fill="#fff" stroke="#d97757" stroke-width="1.8" rx="6"/><text x="622" y="126" fill="#141413" font-size="12" text-anchor="middle">chunk_read</text><text x="622" y="144" fill="#87867f" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">读回原文上下文</text><text x="48" y="186" fill="#87867f" font-family="ui-monospace, monospace" font-size="10">模型每一轮自己挑一个工具 —— 而不是 top-k 拼接</text><text x="48" y="204" fill="#87867f" font-family="ui-monospace, monospace" font-size="10">便宜的先试（关键词），不够再下钻（语义 → 原文块）</text><text x="48" y="232" fill="#141413" font-size="11" font-style="italic">「分层」是省 token 的原因；「给模型工具」本身反而更烧</text><rect width="660" height="266" x="30" y="268" fill="#fff" stroke="#d1cfc5" stroke-width="1.5" rx="8"/><text x="48" y="292" fill="#141413" font-size="13" font-weight="500">检索 token 数（HotpotQA, GPT-5-mini）</text><text x="672" y="292" fill="#87867f" font-family="ui-monospace, monospace" font-size="9" text-anchor="end">越短越省</text><text x="48" y="322" fill="#141413" font-family="ui-monospace, monospace" font-size="10">A-RAG (Naive)</text><rect width="432" height="16" x="180" y="312" fill="#d1cfc5" rx="3"/><text x="620" y="325" fill="#141413" font-size="11" text-anchor="end">27,455</text><text x="48" y="352" fill="#141413" font-family="ui-monospace, monospace" font-size="10">GraphRAG</text><rect width="138" height="16" x="180" y="342" fill="#d1cfc5" rx="3"/><text x="326" y="355" fill="#141413" font-size="11" text-anchor="end">8,744</text><text x="48" y="382" fill="#141413" font-family="ui-monospace, monospace" font-size="10">Naive RAG</text><rect width="84" height="16" x="180" y="372" fill="#d1cfc5" rx="3"/><text x="272" y="385" fill="#141413" font-size="11" text-anchor="end">5,358</text><text x="48" y="412" fill="#141413" font-family="ui-monospace, monospace" font-size="10">A-RAG (Full)</text><rect width="43" height="16" x="180" y="402" fill="#d97757" rx="3"/><text x="231" y="415" fill="#141413" font-size="11" text-anchor="end">2,737</text><path stroke="#d1cfc5" stroke-width="1.2" d="M180 434h432"/><text x="48" y="452" fill="#87867f" font-family="ui-monospace, monospace" font-size="10">同样一套接口，只给一个 embedding 工具 → 27,455 token</text><text x="48" y="470" fill="#87867f" font-family="ui-monospace, monospace" font-size="10">给全三层 → 2,737 token，比固定 top-5 的 Naive RAG 还省一半</text><text x="48" y="498" fill="#87867f" font-family="ui-monospace, monospace" font-size="9">数字取自论文 Table 3 / Table 2，均为 GPT-5-mini backbone</text><text x="360" y="534" fill="#141413" font-size="11" font-style="italic" text-anchor="middle">「检索该由谁决定，取决于模型有多强」</text></svg>